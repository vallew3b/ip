<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detector IP Local</title>
</head>

<body>
    <h2 id="local-ip">Obteniendo IP...</h2>

    <script>
        function getLocalIP() {
            return new Promise((resolve) => {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.createOffer().then(o => pc.setLocalDescription(o));

                pc.onicecandidate = (e) => {
                    if (!e || !e.candidate) return;
                    const match = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                    if (match && /^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1]))/.test(match[1])) {
                        pc.close();
                        resolve(match[1]);
                    }
                };
                setTimeout(() => resolve("No detectada / Bloqueada por mDNS"), 2500);
            });
        }

        getLocalIP().then(ip => document.getElementById('local-ip').textContent = ip);
    </script>
</body>

</html>
